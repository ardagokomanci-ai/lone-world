else if(pose=='sing'){u.aR.rotation.x=-2.3;u.aR.rotation.z=0;u.aL.rotation.x=0;u.aL.rotation.z=-2.2-s*.4;u.lL.rotation.x=s*.5;u.lR.rotation.x=-s*.5;u.up.rotation.x=0;u.up.rotation.z=s*.1;u.up.position.y=1.1+Math.abs(s)*.2}else if(pose=='sit'){u.up.rotation.x=0;u.up.rotation.z=0;u.up.position.y=.8;u.lL.rotation.x=u.lR.rotation.x=-1.5;u.aL.rotation.x=u.aR.rotation.x=-.4;u.aL.rotation.z=u.aR.rotation.z=0}else if(pose=='pray'){u.up.rotation.x=1.3;u.up.position.y=.9;u.aL.rotation.x=u.aR.rotation.x=-1.4;u.lL.rotation.x=u.lR.rotation.x=0;u.aL.rotation.z=u.aR.rotation.z=0;u.up.rotation.z=0}
else{const k=moving?s*.9:0;u.up.rotation.x=moving?.1:0;u.up.rotation.z=0;u.up.rotation.y=moving?s*.12:0;u.up.position.y=1.1+(moving?Math.abs(s)*.07:Math.sin(u.ph*.15)*.015);u.aL.rotation.z=-.06;u.aR.rotation.z=.06;u.lL.rotation.x=k;u.lR.rotation.x=-k;u.aL.rotation.x=-k*1.1;u.aR.rotation.x=k*1.1}}
// ---------- Haritalar
const maps={},BG={parkur:0x1a0510,sehir:0x87ceeb,cami:0xf5d9a8,kabe:0x1b2a4a,futbol:0x87ceeb,basket:0x87ceeb,konser:0x14082b};

function mk(n,floorC,sz,fn){cur=new THREE.Group();cur.visible=false;S.add(cur);const f=new THREE.Mesh(new THREE.CircleGeometry(sz,48),M(floorC));f.rotation.x=-Math.PI/2;cur.add(f);cur.userData={r:sz-2,sp:[0,8]};fn();maps[n]=cur}

box(20,.1,200,0x444444,0,.05,0);box(200,.1,20,0x444444,0,.06,0);

for(let i=0;i<65;i++){
    const a=i/65*6.28, d=30+Math.random()*75, h=16+Math.random()*34;
    const bw=10+Math.random()*8, bd=10+Math.random()*8;
    const bx=Math.cos(a)*d, bz=Math.sin(a)*d;
    
    const bMat = [0xc9ada7,0x9a8c98,0x4a4e69,0xf2e9e4,0x3d5a80,0x293241,0x50514f][i%7];
    box(bw,h,bd,bMat,bx,h/2,bz);
    
    if(i%2==0){
        box(bw*.6,3,bd*.6,0x111111,bx,h+1.5,bz);
        cyl(.5,4,0xffb703,bx,h+5,bz);
    } else {
        box(bw*.8,1.5,bd*.8,0xd00000,bx,h+.75,bz);
    }

    for(let ph=3; ph<h-3; ph+=5){
        box(bw+.2, 1.8, bd*.7, 0xfdf0d5, bx, ph, bz);
        box(bw*.7, 1.8, bd+.2, 0xfdf0d5, bx, ph, bz);
    }

    obstacles.push({type:'box', x:bx, z:bz, w:bw/2+0.6, d:bd/2+0.6});
}

for(let i=0;i<45;i++){
    const x=(Math.random()-.5)*210, z=(Math.random()-.5)*210;
    if(Math.abs(x)<14||Math.abs(z)<14)continue;

    const k=new THREE.Mesh(new THREE.SphereGeometry(3.5,10,8),M(0x2d6a4f));
    k.position.set(x,6,z);cur.add(k);

cur.userData.sp=[0,0];
});

box(3,6,.6,0x6a4c93,0,3,-14.3);box(.6,.6,.6,0xffd700,0,6.3,-14.3);

[-16,16].forEach(x=>{cyl(.15,6,0x888888,x,3,0);box(.2,2.2,3,0xffffff,x-Math.sign(x)*.4,5.5,0);const r=new THREE.Mesh(new THREE.TorusGeometry(.6,.07,8,20),M(0xff6600));r.rotation.x=Math.PI/2;r.position.set(x-Math.sign(x)*1.1,5,0);cur.add(r)});

cur.userData.sp=[-8,0];cur.userData.r=30});

const crew=[],drones=[],cams=[],cranes=[],wp_=new THREE.Vector3(),crowd=[];
